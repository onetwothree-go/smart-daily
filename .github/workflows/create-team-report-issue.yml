name: One-off create team-report issue
on:
  push:
    paths:
      - '.github/workflows/team-report-trigger.txt'
jobs:
  create-issue:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
      - name: Create issue via GitHub CLI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --repo onetwothree-go/smart-daily \
            --title "[团队日报双块] 团队日报也要考勤与提交分开（每人块内双块）：请修订 C11③ 并过全组评审" \
            --body-file .github/workflows/team-report-issue-body.md
