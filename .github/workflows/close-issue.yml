name: One-off close completed issue
on:
  push:
    paths:
      - '.github/workflows/close-issue-trigger.txt'
jobs:
  close-issue:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
      - name: Close issue #24
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue close 24 \
            --repo onetwothree-go/smart-daily \
            --reason completed \
            --comment "$(cat .github/workflows/close-issue-comment.md)"
