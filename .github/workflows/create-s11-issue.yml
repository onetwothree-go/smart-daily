name: Create S11 issue (one-off)

on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  create:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create issue
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const title = '[S11乙案] 个人日报考勤独立成块 + 工作记录列表：请修订 C11① 并过全组评审';
            const body = fs.readFileSync('.github/workflows/s11-issue-body.md', 'utf8');
            const res = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body
            });
            core.setOutput('issue_number', res.data.number);
            core.info(`created issue #${res.data.number}: ${res.data.html_url}`);
